name: Update Space and Astronomy News

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-news-deployment
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RSS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser

      - name: Update news feeds
        run: |
          python scripts/update_news.py

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: |
          quarto render

      - name: Preserve custom domain
        run: |
          cp CNAME _site/CNAME

      - name: Publish website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false